    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Creanty</title>

        <link rel="stylesheet" href="./assets/css/style.css">
        <link rel="stylesheet" href="./assets/css/responsive.css">
    </head>

    <body>

        <!-- Header -->
        <header class="header">
            <div class="header-hero">
                <div class="header-hero-cotainer">
                    <div class="header-hero-top">
                        <div class="header-hero-top__info">
                            <div class="header-hero-top__info__email">
                                <img src="./assets/images/email.png" alt="email">
                                <span>Info@webmail.com</span>
                            </div>
                            <div class="header-hero-top__info__location">
                                <img src="./assets/images/location.png" alt="location">
                                <span>547 ns tower St. anglo City, USA</span>
                            </div>
                        </div>

                        <div class="header-hero-top__social">
                            <span class="header-hero-top__social__icon">
                                <i class="fa-brands fa-facebook-f"></i>
                            </span>
                            <span class="header-hero-top__social__icon">
                                <i class="fa-brands fa-twitter"></i>
                            </span>
                            <span class="header-hero-top__social__icon">
                                <i class="fa-brands fa-instagram"></i>
                            </span>
                            <span class="header-hero-top__social__icon">
                                <i class="fa-brands fa-youtube"></i>
                            </span>
                            <span class="header-hero-top__social__icon">
                                <i class="fa-brands fa-pinterest"></i>
                            </span>
                        </div>
                    </div>
                </div>

                <div class="header-hero-navbar">
                    <div class="header-hero-navbar__left">
                        <a href="#" class="header-hero-navbar__left__logo">
                            <span class="header-hero-navbar__left__logo--icon"></span>
                            <span class="header-hero-navbar__left__logo--text">Reanty<span
                                    class="header-hero-navbar__left__logo--dot">.</span></span>
                        </a>
                    </div>
                    <div class="header-hero-navbar__right">
                        <ul class="header-hero-navbar__right__menu">
                            <li class="header-hero-navbar__right__menu__active"><a href="/home"
                                    class="home-active">Home</a></li>
                            <li class="header-hero-navbar__right__menu__active"><a href="/about">About</a></li>
                            <li class="header-hero-navbar__right__menu__active"><a href="/feature">Feature</a></li>
                            <li class="header-hero-navbar__right__menu__active"><a href="/market">Market</a></li>
                            <li class="header-hero-navbar__right__menu__active"><a href="/servie">Servies</a></li>
                            <li class="header-hero-navbar__right__menu__active"><a href="/contact">Contact</a></li>
                            <li class="header-hero-navbar__right__menu__auth"><a href="/login">Log In</a></li>
                            <li class="header-hero-navbar__right__menu__auth btn-active"><a href="/signin">Sign Up</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

        </header>

        <main class="container">

            <!-- Commercial Real Estate -->
            <section class="commercial-real-estate">
            </section>

            <!-- Dream Living Space -->
            <section class="dream-living-space">
            </section>

            <!-- About Home -->
            <section class="about-home">
            </section>

            <!-- Services -->
            <section class="services">
            </section>

            <!-- Featured Property -->
            <section class="featured-property">
            </section>

            <!-- Property Map -->
            <section class="property-map">
            </section>

            <!-- Testimonial -->
            <section class="testimonial">
            </section>

            <!-- Renting Real Estate CTA -->
            <section class="renting-real-estate-cta">
            </section>

            <!-- Blog -->
            <section class="housy-blog">
            </section>

            <!-- Contact -->
            <section class="contact">
            </section>

        </main>

        <footer class="footer">
        </footer>

        <script src="./creanty.js"></script>
    </body>

    </html>
